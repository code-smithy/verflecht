name: Import Lobbywatch

on:
  schedule:
    # Lobbywatch refreshes its public export early on Monday.
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lobbywatch-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Lobbywatch adapter
        run: python -m unittest tests.pipeline.test_lobbywatch -v

      - name: Restore raw snapshots and partial download
        uses: actions/cache/restore@v4
        with:
          path: data/raw/lobbywatch
          key: lobbywatch-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lobbywatch-v1-

      - name: Import weekly export
        run: python import_lobbywatch.py

      - name: Corroborate against official Parliament declarations
        run: |
          python verify_lobbywatch.py
          python build_data_pipeline.py

      - name: Save raw snapshot and official-response checkpoint
        if: always() && hashFiles('data/raw/lobbywatch/manifest.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/lobbywatch
          key: lobbywatch-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload candidates and source archive
        uses: actions/upload-artifact@v4
        with:
          name: lobbywatch-import-${{ github.run_id }}
          path: |
            data/imports/lobbywatch
            data/imports/lobbywatch-verified
            data/raw/lobbywatch/manifest.json
            data/raw/lobbywatch/lobbywatch-export.zip
            data/raw/lobbywatch/parliament
          retention-days: 14
          compression-level: 0

      - name: Write summary
        if: success() && hashFiles('data/imports/lobbywatch-verified/verification-report.md') != ''
        run: cat data/imports/lobbywatch-verified/verification-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish review branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/lobbywatch data/imports/lobbywatch-verified public/data/graph.json
          if ! git diff --cached --quiet; then
            branch="codex/lobbywatch-refresh"
            git fetch origin "$branch:refs/remotes/origin/$branch" || true
            git checkout -B "$branch"
            git commit -m "Refresh and corroborate Lobbywatch data"
            git push --force-with-lease origin "HEAD:refs/heads/$branch"
            gh workflow run ci.yml --ref "$branch"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Create or view the review pull request](https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No source or verification changes; no review branch update needed." >> "$GITHUB_STEP_SUMMARY"
          fi
