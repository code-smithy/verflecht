name: Import Swiss Parliament

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      language:
        description: Language to import (nightly runs always use all)
        type: choice
        default: de
        options: [de, fr, it, en, all]
      max_seconds:
        description: Import time budget per language (60–14400 seconds)
        type: number
        default: 900

permissions:
  contents: read

concurrency:
  group: parliament-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.config.outputs.languages }}
      max_seconds: ${{ steps.config.outputs.max_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate configuration and test pipeline
        id: config
        env:
          IMPORT_LANGUAGE: ${{ inputs.language || 'all' }}
          IMPORT_MAX_SECONDS: ${{ github.event_name == 'schedule' && '14400' || format('{0}', inputs.max_seconds) }}
        run: |
          python build_data_pipeline.py
          python -m unittest discover -s tests/pipeline -v
          python -m pipeline.language_import config >> "$GITHUB_OUTPUT"

  import:
    name: Import ${{ matrix.language }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.prepare.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Identical runner path allows a one-time restore of the legacy cache.
      # Each job has its own runner and thereafter its own language cache key.
      - name: Restore language checkpoint (or legacy archive)
        uses: actions/cache/restore@v4
        with:
          path: data/raw/parliament
          key: parliament-v2-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parliament-v2-${{ matrix.language }}-
            parliament-v1-

      - name: Import one language
        env:
          IMPORT_LANGUAGE: ${{ matrix.language }}
          IMPORT_MAX_SECONDS: ${{ needs.prepare.outputs.max_seconds }}
          IMPORT_INTERVAL: ${{ inputs.language != 'all' && github.event_name == 'workflow_dispatch' && '0.2' || '0.8' }}
        # Keep the aggregate request-start rate at five per second.
        run: >-
          python import_parliament.py --refresh --languages "$IMPORT_LANGUAGE"
          --workers 4 --interval "$IMPORT_INTERVAL" --max-seconds "$IMPORT_MAX_SECONDS"
          --output "data/raw/result/$IMPORT_LANGUAGE/research.json"
      - name: Upload normalized language result
        uses: actions/upload-artifact@v4
        with:
          name: parliament-result-${{ matrix.language }}
          path: data/raw/result
          retention-days: 7
      - name: Save language checkpoint
        if: always() && hashFiles('data/raw/parliament/manifest.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/parliament
          key: parliament-v2-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload archive and coverage
        if: always() && hashFiles('data/raw/parliament/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: parliament-archive-${{ matrix.language }}
          path: data/raw/parliament
          retention-days: 7
          compression-level: 0
      - name: Summarize language coverage
        if: always() && hashFiles('data/raw/parliament/manifest.json') != ''
        run: python -m pipeline.language_import summary data/raw/parliament/manifest.json >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [prepare, import]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: parliament-result-*
          path: data/raw/results
          merge-multiple: true
      - name: Combine language snapshots and build public graph
        run: |
          python -m pipeline.language_import combine data/raw/results data/imports/parliament
          python build_data_pipeline.py
      - name: Upload combined data for review
        uses: actions/upload-artifact@v4
        with:
          name: parliament-combined
          path: |
            data/imports/parliament
            public/data/graph.json
          retention-days: 7
      - name: Commit and publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/parliament public/data/graph.json public/data/graph.parts
          if ! git diff --cached --quiet; then
            git commit -m "Update normalized Parliament language snapshots"
            git push origin HEAD:main
            gh workflow run ci.yml --ref main
          fi
